<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shop | Arif Clothing</title>

<link rel="stylesheet" href="style.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

</head>

<body>

<header class="header">

<div class="top-nav">

<div class="logo">
<i class="fa-solid fa-shirt"></i>

<div>
<h2>Arif</h2>
<p>Clothing</p>
</div>

</div>

<div class="search-box">

<i class="fa-solid fa-search"></i>

<input type="text" placeholder="Search Products">

</div>

<div class="nav-icons">

<div class="item">
<i class="fa-regular fa-heart"></i>
Wishlist
</div>

<div class="item">
<i class="fa-solid fa-cart-shopping"></i>
Cart
</div>

</div>

</div>

</header>

<section class="shop">

<div class="filter">

<h2>Filters</h2>

<h4>Category</h4>

<label><input type="checkbox"> Men</label>

<label><input type="checkbox"> Women</label>

<label><input type="checkbox"> Kids</label>

<label><input type="checkbox"> Shoes</label>

<label><input type="checkbox"> Bags</label>

<hr>

<h4>Price</h4>

<input type="range" min="100" max="5000">

<hr>

<h4>Size</h4>

<label>S</label>
<label>M</label>
<label>L</label>
<label>XL</label>

</div>

<div class="products-grid">
    <p id="notFound" style="display:none">
No Product Found
</p>

<div class="product-card">

<img src="images/product1.jpg">

<h3>Oversized T-Shirt</h3>

<p>₹599</p>

<button>Add To Cart</button>

</div>

<div class="product-card">

<img src="images/product2.jpg">

<h3>Hoodie</h3>

<p>₹999</p>

<button>Add To Cart</button>

</div>

<div class="product-card">

<img src="images/product3.jpg">

<h3>Sneakers</h3>

<p>₹1499</p>

<button>Add To Cart</button>

</div>

<div class="product-card">

<img src="images/product4.jpg">

<h3>Backpack</h3>

<p>₹1199</p>

<button>Add To Cart</button>

</div>

<div class="product-card">

<img src="images/product5.jpg">

<h3>Formal Shirt</h3>

<p>₹799</p>

<button>Add To Cart</button>

</div>

<div class="product-card">

<img src="images/product6.jpg">

<h3>Women's Top</h3>

<p>₹699</p>

<button>Add To Cart</button>

</div>

</div>

</section>

</body>

</html>
