<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shopping Cart | Arif Clothing</title>

<link rel="stylesheet" href="style.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
</head>

<body>

<header class="header">

<div class="top-nav">

<div class="logo">
<i class="fa-solid fa-shirt"></i>

<div>
<h2>Arif</h2>
<p>Clothing</p>
</div>

</div>

<h2>Shopping Cart</h2>

</div>

</header>

<section class="cart-container">


<div class="cart-items" id="cartItems">

    <div class="cart-item">

        <img src="images/product1.jpg">

            <div class="details">

                <h3>Premium T-Shirt</h3>

                    <p>₹599</p>

                    <div class="quantity">

                     <button onclick="decrease(this)">-</button>

                      <input type="text" value="1" readonly>

                        <button onclick="increase(this)">+</button>

                    </div>

            </div>

                <button class="remove">Remove</button>

    </div>

    <div class="cart-item">

        <img src="images/product2.jpg">

            <div class="details">

                <h3>Men's Hoodie</h3>

                     <p>₹999</p>

                    <div class="quantity">

                        <button onclick="decrease(this)">-</button>

                        <input type="text" value="1" readonly>

                        <button onclick="increase(this)">+</button>

                    </div>

            </div>

                    <button class="remove">Remove</button>

    </div>

    </div>

    <div class="summary">

    <h2>Order Summary</h2>

    <p>Subtotal <span>₹1598</span></p>

    <p>Delivery <span>Free</span></p>

    <p>Discount <span>-₹200</span></p>

    <hr>

    <h3>Total <span>₹1398</span></h3>

    <button class="checkout-btn">
    Proceed to Checkout
    </button>

    </div>
</div>

    </section>

<script src="script.js"></script>

</body>
</html>
